# One block per area of work. To add photos:
#   1. Resize each photo to about 1600 px wide and save it in assets/images/hands-on/
#   2. Add an entry under "photos" with the file name, alt text (what the photo shows), and a caption.
#
#     photos:
#       - file: cctv-roof-camera.jpg
#         alt: A weatherproof camera mounted under a roof edge
#         caption: Replacement camera with a sealed outdoor junction.
#
# Keep client names, addresses, and live camera views out of photos and captions unless the client agrees.

- id: cctv
  title: CCTV installation
  summary: "Installing and replacing camera systems for indoor and outdoor coverage, from mounting and cabling to aiming each camera and checking the picture."
  lessons:
    - "Expect the unexpected in older setups. Old mounts and cabling rarely line up with new hardware, so flexibility matters."
    - "Weather-proofing matters. Sealing every outdoor junction properly is what keeps a system working through harsh weather."
    - "Check each camera's field of view before tightening anything down. It saves a second trip up the ladder."
  photos: []

